# Blueprint для Render Static Site.
# Render применяет правила, только если по запрошенному пути нет файла.
services:
  # Посредник подсказок Яндекса для Keyword Finder (server/, без зависимостей).
  # Бесплатный тариф засыпает после 15 минут простоя: днём его будит .github/workflows/keep-api-awake.yml,
  # а любая страница сайта — запросом /healthz при открытии.
  - type: web
    name: seotoolkitru-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    healthCheckPath: /healthz
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://seotoolkitru.onrender.com
  - type: web
    name: seotoolkitru
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Домен сайта для canonical, Open Graph и sitemap.xml (без слэша в конце).
      - key: SITE_URL
        value: https://seotoolkitru.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    routes:
    # Генерируется scripts/render-routes.mjs (npm run routes) — не правьте вручную.
    # Render сопоставляет пути без учёта завершающего слэша, поэтому /page/ и /page
    # обрабатываются одинаково: оба варианта отдают /page.html. Не используйте здесь redirect.
      - type: rewrite
        source: /keyword-finder/
        destination: /keyword-finder.html
      - type: rewrite
        source: /keyword-finder
        destination: /keyword-finder.html
      - type: rewrite
        source: /serp-preview/
        destination: /serp-preview.html
      - type: rewrite
        source: /serp-preview
        destination: /serp-preview.html
      - type: rewrite
        source: /robots-builder/
        destination: /robots-builder.html
      - type: rewrite
        source: /robots-builder
        destination: /robots-builder.html
      - type: rewrite
        source: /text-seo/
